name: Update Go version

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  update-go-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable

      - name: Update go version in go.mod
        run: go get go@$(go env GOVERSION | sed 's/go//')

      - name: Create pull request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          commit-message: "chore(deps): update go version"
          title: "chore(deps): update go version"
          body: |
            Automated go version updates.
          branch: update-go-version
          labels: dependencies
